# stock_gui 自动化交叉编译 + 打包发布 (Linux/WSL -> Windows x86-64, Qt5)
# 本机为 LAN 自托管 Gitea, runner 不自动 checkout, 故第一步显式克隆源码。
# token 取自 runner daemon 所用凭据文件 (与其它项目 workflow 约定一致)。
name: Cross-compile stock_gui

env:
  GITEA_URL: http://10.168.1.242:3000
  GITEA_REPO: srdev/stock_gui
  CREDS_FILE: /home/srdev/devdisk/wch/.firmware/gitea.env

on:
  push:
    branches: [ main, master ]
  tags:
    - 'v*'
  workflow_dispatch:

jobs:
  cross-build-windows:
    name: Windows x86-64 打包发布
    runs-on: self-hosted
    steps:
      - name: 从 Gitea 克隆源码
        run: |
          CREDS="$(grep -m1 '^GITEA_TOKEN=' "${{ env.CREDS_FILE }}" | cut -d= -f2)"
          HOST="${GITEA_URL#*://}"
          unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY
          export GIT_PROXY_COMMAND=""; export GIT_NO_PROXY="*"; export GIT_TERMINAL_PROMPT=0
          git clone --depth 1 "http://${CREDS}@${HOST}/${GITEA_REPO}.git" .
          if [ ! -f build.sh ]; then echo "FATAL: repo not cloned"; exit 1; fi
      - name: 设置工具链 PATH
        run: |
          export PATH="/home/srdev/devdisk/work/cc-toolchain/bin:/usr/bin:/bin:/home/srdev/devdisk/work/cc-toolchain/mingw64/usr/bin:$PATH"
          echo "PATH=$PATH" | tee -a "$GITHUB_ENV"
      - name: 交叉编译
        run: bash ./build.sh
      - name: 打包并上传到 Gitea Release
        run: |
          set -e
          export GITEA_TOKEN="$(grep -m1 '^GITEA_TOKEN=' "${{ env.CREDS_FILE }}" | cut -d= -f2)"
          SHA="$(git rev-parse --short HEAD || echo nogit)"
          STAMP="$(date +%Y%m%d-%H%M)"
          BASENAME="stock_gui_${SHA}_${STAMP}"
          chmod +x scripts/deploy_win.sh scripts/upload_release.sh
          ./scripts/deploy_win.sh build_release_x64 "$BASENAME"
          PKG_VERSION="$SHA" ./scripts/upload_release.sh "${BASENAME}.zip"
